<!-- src/app/components/menu-page/menu-page.component.html -->

@if (loading) 
{
    <div class="spinner">Loading...</div>
} 
@else if (error) 
{
    <div class="error">{{ error }}</div>
} 
@else 
{
    <app-item-grid 
        [menuItems]="menuItems"
        [isVerticalOrientation]="isVerticalOrientation"
        (itemClicked)="onItemClicked($event)">
    </app-item-grid>
}
